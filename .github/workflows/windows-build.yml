name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "ClashArtMeter_DualBrowser/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package Windows app
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run automated tests
        working-directory: ClashArtMeter_DualBrowser
        run: python -m unittest discover -s tests -v

      - name: Install PyInstaller
        run: python -m pip install "pyinstaller>=6.0,<7"

      - name: Build portable executable
        working-directory: ClashArtMeter_DualBrowser
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ClashArtMeterDual --icon resources/app.ico app.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: ClashArtMeter-DualBrowser-Windows-x64
          path: ClashArtMeter_DualBrowser/dist/ClashArtMeterDual.exe
          if-no-files-found: error
          retention-days: 30
